name: ci

on:
  push:
  pull_request:

jobs:
  ujg-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:ujg-source
      - run: pnpm validate:ds-bindings
      - run: pnpm validate:ujg-design-system
      - run: pnpm typecheck:design-system
      - run: pnpm test:storybook
      - run: pnpm build:design-system
      - run: pnpm build-storybook

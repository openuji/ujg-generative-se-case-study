manifest_version: 4

ujg: ujg/workshop-registration.ujg.jsonld

backend: domain/reference

interfaces:
  - touchpoint_ref: urn:ujg:touchpoint:workshop-app
    target: apps/reference-frontend
    kind: browser
    design_systems:
      - design-system
    interaction_state_owner: client
    transport:
      protocol: http
      documentation:
        format: openapi
        output: domain/reference/openapi/openapi.json
        ui: swagger-ui

  - touchpoint_ref: urn:ujg:touchpoint:email
    kind: email
    design_systems:
      - design-system
    interaction_state_owner: external
    delivery:
      adapter: fake-client

adapters:
  persistence: sqlite
  identity: fake-auth-adapter

bootstrap: fixtures